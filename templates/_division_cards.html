{% if divisiones %}
<div class="card">
  <h2 style="text-align:center; margin-bottom:2px;">Categorías de {{ categoria }}</h2>
  <p style="text-align:center; color:#888; font-size:0.85rem; margin:0 0 16px;">Elige una categoría.</p>
  <div class="cupos-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">
    {% for d in divisiones %}
    <a href="{{ url_for(categoria_endpoint, categoria=categoria, division=d) }}" style="text-decoration:none; color:inherit;">
      <div class="cupo-item" style="text-align:center; padding:16px 12px; {% if d == division %}border-color:var(--verde); box-shadow:inset 0 0 0 1.5px var(--verde);{% endif %}">
        <strong style="display:block; font-size:0.95rem; color:var(--verde-osc);">{{ d }}</strong>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
{% endif %}
