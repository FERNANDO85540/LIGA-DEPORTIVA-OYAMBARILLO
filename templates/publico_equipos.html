{% extends "base.html" %}
{% block content %}

<p><a href="{{ url_for('publico_inicio') }}">&larr; Volver</a></p>

<div class="card" style="text-align:center; background: linear-gradient(135deg, #1e7d32, #14532d); color: white;">
  <h1 style="margin:0; font-size:1.4rem;">🛡️ Equipos</h1>
</div>

{% set categoria_endpoint = 'publico_equipos' %}
{% include "_categoria_cards.html" %}
{% include "_division_cards.html" %}

<div class="card">
  <div class="cupos-grid">
    {% for e in equipos %}
    <div class="cupo-item">
      <strong style="display:block; font-size:1rem; margin-bottom:2px;">{{ e.nombre }}</strong>
      <span style="color:#888; font-size:0.85rem;">{{ conteos[e.nombre] }} jugador(es)</span>
    </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
