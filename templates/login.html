{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 40px auto;">
  <h2>Ingresar</h2>
  <form method="post">
    <label>Usuario</label>
    <input type="text" name="usuario" required autofocus>
    <label>Clave</label>
    <input type="password" name="clave" required>
    <button type="submit">Ingresar</button>
  </form>
</div>
<div class="card" style="max-width: 380px; margin: -10px auto 40px; text-align:center;">
  <a href="{{ url_for('publico_inicio') }}">👀 Ver información pública de la liga (sin necesidad de cuenta)</a>
</div>
{% endblock %}
