<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Liga Deportiva Oyambarillo{% endblock %}</title>
<style>
  :root {
    --verde: #1e7d32;
    --verde-osc: #14532d;
    --fondo: #f4f6f5;
    --borde: #dfe3e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: #1c1c1c;
  }
  header {
    background: linear-gradient(135deg, var(--verde), var(--verde-osc));
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
  header a:hover { opacity: 1; text-decoration: underline; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card {
    background: white;
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  #toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    left: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #a13a2f;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    font-size: 0.9rem;
    max-width: 420px;
    width: 100%;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: auto;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.toast-ok { background: var(--verde-osc); }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 0.9rem; }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    font-size: 0.95rem;
  }
  button {
    background: var(--verde);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 14px;
  }
  button:hover { background: var(--verde-osc); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); }
  th { background: #eef3ee; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge-ok { background: #e6f4ea; color: var(--verde-osc); }
  .badge-full { background: #fdecea; color: #a13a2f; }
  .btn-del {
    background: transparent;
    color: #a13a2f;
    border: 1px solid #a13a2f;
    padding: 4px 10px;
    font-size: 0.8rem;
    margin: 0;
  }
  .btn-del:hover { background: #fdecea; }
  .cupos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
  .cupo-item { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; }
  .cupo-item strong { display: block; font-size: 0.95rem; }
</style>
</head>
<body>
<header>
  <h1>⚽ Liga Deportiva Oyambarillo</h1>
  {% if session.get('logged_in') %}
    <a href="{{ url_for('logout') }}">Cerrar sesión</a>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
<div id="toast-container"></div>
<script>
(function () {
  const mensajes = [
    {% for categoria, m in get_flashed_messages(with_categories=true) %}
      {texto: {{ m|tojson }}, categoria: {{ categoria|tojson }}},
    {% endfor %}
  ];
  const container = document.getElementById('toast-container');
  mensajes.forEach(function (msg, i) {
    setTimeout(function () {
      const toast = document.createElement('div');
      toast.className = 'toast' + (msg.categoria === 'ok' ? ' toast-ok' : '');
      toast.textContent = msg.texto;
      container.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });
      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 300);
      }, 4500);
    }, i * 150);
  });
})();
</script>
<script>
// Editor simple de rotación para inputs de tipo file con foto.
// Uso: <input type="file" data-rotador accept=".jpg,.jpeg,.png">
document.querySelectorAll('input[type=file][data-rotador]').forEach(function (input) {
  const wrapper = document.createElement('div');
  wrapper.style.marginTop = '8px';
  input.insertAdjacentElement('afterend', wrapper);

  let rotacion = 0;
  let imgOriginal = null;

  function render() {
    wrapper.innerHTML = '';
    if (!imgOriginal) return;

    const canvas = document.createElement('canvas');
    const swap = rotacion % 180 !== 0;
    canvas.width = swap ? imgOriginal.height : imgOriginal.width;
    canvas.height = swap ? imgOriginal.width : imgOriginal.height;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((rotacion * Math.PI) / 180);
    ctx.drawImage(imgOriginal, -imgOriginal.width / 2, -imgOriginal.height / 2);
    ctx.restore();

    canvas.style.maxWidth = '220px';
    canvas.style.display = 'block';
    canvas.style.border = '1px solid var(--borde)';
    canvas.style.borderRadius = '8px';
    canvas.style.marginBottom = '6px';
    wrapper.appendChild(canvas);

    const btnBox = document.createElement('div');
    btnBox.style.display = 'flex';
    btnBox.style.gap = '6px';

    const btnIzq = document.createElement('button');
    btnIzq.type = 'button';
    btnIzq.textContent = '⟲ Girar izquierda';
    btnIzq.style.padding = '4px 10px';
    btnIzq.style.fontSize = '0.8rem';
    btnIzq.style.margin = '0';
    btnIzq.onclick = function () { rotacion = (rotacion - 90 + 360) % 360; render(); actualizarArchivo(canvas); };

    const btnDer = document.createElement('button');
    btnDer.type = 'button';
    btnDer.textContent = 'Girar derecha ⟳';
    btnDer.style.padding = '4px 10px';
    btnDer.style.fontSize = '0.8rem';
    btnDer.style.margin = '0';
    btnDer.onclick = function () { rotacion = (rotacion + 90) % 360; render(); actualizarArchivo(canvas); };

    btnBox.appendChild(btnIzq);
    btnBox.appendChild(btnDer);
    wrapper.appendChild(btnBox);

    actualizarArchivo(canvas);
  }

  function actualizarArchivo(canvas) {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      const nombre = (input.dataset.nombreOriginal || 'foto') + '.jpg';
      const file = new File([blob], nombre, { type: 'image/jpeg' });
      const dt = new DataTransfer();
      dt.items.add(file);
      input._archivoRotado = dt.files;
    }, 'image/jpeg', 0.9);
  }

  input.addEventListener('change', function () {
    rotacion = 0;
    const file = input.files && input.files[0];
    if (!file) { wrapper.innerHTML = ''; imgOriginal = null; return; }
    input.dataset.nombreOriginal = file.name.replace(/\.[^.]+$/, '');
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        imgOriginal = img;
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  const form = input.closest('form');
  if (form) {
    form.addEventListener('submit', function () {
      if (input._archivoRotado) {
        input.files = input._archivoRotado;
      }
    });
  }
});
</script>
</body>
</html>
