<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Liga Deportiva Oyambarillo{% endblock %}</title>
<style>
  :root {
    --verde: #1e7d32;
    --verde-osc: #14532d;
    --fondo: #f4f6f5;
    --borde: #dfe3e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: #1c1c1c;
  }
  header {
    background: linear-gradient(135deg, var(--verde), var(--verde-osc));
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
  header a:hover { opacity: 1; text-decoration: underline; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card {
    background: white;
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  #toast-container {
    position: fixed;
    top: 16px;
    right: 16px;
    left: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #a13a2f;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    font-size: 0.9rem;
    max-width: 420px;
    width: 100%;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: auto;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.toast-ok { background: var(--verde-osc); }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 0.9rem; }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    font-size: 0.95rem;
  }
  button {
    background: var(--verde);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 14px;
  }
  button:hover { background: var(--verde-osc); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); }
  th { background: #eef3ee; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge-ok { background: #e6f4ea; color: var(--verde-osc); }
  .badge-full { background: #fdecea; color: #a13a2f; }
  .btn-del {
    background: transparent;
    color: #a13a2f;
    border: 1px solid #a13a2f;
    padding: 4px 10px;
    font-size: 0.8rem;
    margin: 0;
  }
  .btn-del:hover { background: #fdecea; }
  .cupos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
  .cupo-item { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; }
  .cupo-item strong { display: block; font-size: 0.95rem; }
</style>
</head>
<body>
<header>
  <h1>⚽ Liga Deportiva Oyambarillo</h1>
  {% if session.get('logged_in') %}
    <a href="{{ url_for('logout') }}">Cerrar sesión</a>
  {% endif %}
</header>
<main>
  {% block content %}{% endblock %}
</main>
<div id="toast-container"></div>
<script>
(function () {
  const mensajes = [
    {% for categoria, m in get_flashed_messages(with_categories=true) %}
      {texto: {{ m|tojson }}, categoria: {{ categoria|tojson }}},
    {% endfor %}
  ];
  const container = document.getElementById('toast-container');
  mensajes.forEach(function (msg, i) {
    setTimeout(function () {
      const toast = document.createElement('div');
      toast.className = 'toast' + (msg.categoria === 'ok' ? ' toast-ok' : '');
      toast.textContent = msg.texto;
      container.appendChild(toast);
      requestAnimationFrame(function () { toast.classList.add('show'); });
      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 300);
      }, 4500);
    }, i * 150);
  });
})();
</script>
<script>
// Editor simple de rotación para inputs de tipo file con foto.
// Uso: <input type="file" data-rotador accept=".jpg,.jpeg,.png">
// Si además tiene data-ocr-cedula='{"cedula":"cedula","nombres":"nombres",...}'
// (mapa campo_detectado -> name del input a llenar en el mismo form), intenta leer
// los datos de una cédula ecuatoriana con Tesseract.js (OCR en el propio celular)
// y autocompleta esos campos para que el delegado no los transcriba a mano.
document.querySelectorAll('input[type=file][data-rotador]').forEach(function (input) {
  const wrapper = document.createElement('div');
  wrapper.style.marginTop = '8px';
  input.insertAdjacentElement('afterend', wrapper);

  const ocrStatus = document.createElement('p');
  ocrStatus.style.fontSize = '0.8rem';
  ocrStatus.style.margin = '4px 0 0';
  let ocrTimer = null;

  let rotacion = 0;
  let imgOriginal = null;

  function render() {
    wrapper.innerHTML = '';
    if (!imgOriginal) return;

    const canvas = document.createElement('canvas');
    const swap = rotacion % 180 !== 0;
    canvas.width = swap ? imgOriginal.height : imgOriginal.width;
    canvas.height = swap ? imgOriginal.width : imgOriginal.height;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((rotacion * Math.PI) / 180);
    ctx.drawImage(imgOriginal, -imgOriginal.width / 2, -imgOriginal.height / 2);
    ctx.restore();

    canvas.style.maxWidth = '220px';
    canvas.style.display = 'block';
    canvas.style.border = '1px solid var(--borde)';
    canvas.style.borderRadius = '8px';
    canvas.style.marginBottom = '6px';
    wrapper.appendChild(canvas);

    const btnBox = document.createElement('div');
    btnBox.style.display = 'flex';
    btnBox.style.gap = '6px';

    const btnIzq = document.createElement('button');
    btnIzq.type = 'button';
    btnIzq.textContent = '⟲ Girar izquierda';
    btnIzq.style.padding = '4px 10px';
    btnIzq.style.fontSize = '0.8rem';
    btnIzq.style.margin = '0';
    btnIzq.onclick = function () { rotacion = (rotacion - 90 + 360) % 360; render(); };

    const btnDer = document.createElement('button');
    btnDer.type = 'button';
    btnDer.textContent = 'Girar derecha ⟳';
    btnDer.style.padding = '4px 10px';
    btnDer.style.fontSize = '0.8rem';
    btnDer.style.margin = '0';
    btnDer.onclick = function () { rotacion = (rotacion + 90) % 360; render(); };

    btnBox.appendChild(btnIzq);
    btnBox.appendChild(btnDer);
    wrapper.appendChild(btnBox);
    wrapper.appendChild(ocrStatus);

    actualizarArchivo(canvas);
    programarOCR(canvas);
  }

  function actualizarArchivo(canvas) {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      const nombre = (input.dataset.nombreOriginal || 'foto') + '.jpg';
      const file = new File([blob], nombre, { type: 'image/jpeg' });
      const dt = new DataTransfer();
      dt.items.add(file);
      input._archivoRotado = dt.files;
    }, 'image/jpeg', 0.9);
  }

  function programarOCR(canvas) {
    if (!input.dataset.ocrCedula) return;
    if (typeof Tesseract === 'undefined') {
      // El lector no cargó (ej. sin internet en ese momento, o el CDN no respondió).
      // Antes esto fallaba en silencio; ahora se avisa en vez de solo mostrar "no se pudo leer".
      ocrStatus.textContent = '⚠️ El lector automático no cargó en este navegador (revisa tu conexión a internet y recarga la página). Completa los datos a mano.';
      ocrStatus.style.color = '#a13a2f';
      return;
    }
    clearTimeout(ocrTimer);
    ocrStatus.textContent = '';
    ocrTimer = setTimeout(function () { leerCedula(canvas); }, 350);
  }

  // Convierte a blanco y negro y sube el contraste antes de leer: ayuda bastante
  // con fotos con sombra, poca luz o tomadas a distancia (celular/WhatsApp).
  function prepararParaOCR(canvasOriginal) {
    const c = document.createElement('canvas');
    c.width = canvasOriginal.width;
    c.height = canvasOriginal.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(canvasOriginal, 0, 0);
    const imgData = ctx.getImageData(0, 0, c.width, c.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gris = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const ajustado = Math.min(255, Math.max(0, (gris - 128) * 1.4 + 128));
      d[i] = d[i + 1] = d[i + 2] = ajustado;
    }
    ctx.putImageData(imgData, 0, 0);
    return c;
  }

  // En vez de escoger UN intento completo como "el mejor" (lo que puede
  // agarrar basura completa si ese intento en particular se equivocó en
  // algo, aunque haya llenado más campos), se compara cada dato por
  // separado entre TODOS los intentos y se usa el valor en el que más
  // coincidan. Así un dato mal leído en un solo intento no gana solo por
  // acompañarse de otro campo "lleno" (aunque también esté mal).
  function elegirPorConsenso(datosPorIntento) {
    const campos = ['cedula', 'nombres', 'apellidos', 'fecha_nacimiento'];
    const resultado = {};
    campos.forEach(function (campo) {
      const conteo = {};
      datosPorIntento.forEach(function (d) {
        const valor = d[campo];
        if (!valor) return;
        if (valor.replace(/\s/g, '').length < 2) return; // descarta fragmentos sueltos de 1 caracter
        conteo[valor] = (conteo[valor] || 0) + 1;
      });
      let mejorValor = null, mejorConteo = 0;
      Object.keys(conteo).forEach(function (valor) {
        if (conteo[valor] > mejorConteo) { mejorConteo = conteo[valor]; mejorValor = valor; }
      });
      if (mejorValor) resultado[campo] = mejorValor;
    });
    return resultado;
  }

  function leerCedula(canvas) {
    ocrStatus.textContent = '🔍 Leyendo cédula, un momento...';
    ocrStatus.style.color = '#888';

    // Se intenta leer de varias formas y se usa la que más datos rescate:
    // (1) la foto tal cual, sin tocar; (2) con contraste ajustado (ayuda a
    // fotos oscuras); y (3) si el sistema logra ubicar dónde está la cédula
    // dentro de la foto completa (útil cuando no vino recién tomada con guía,
    // sino ya lista por WhatsApp), esa zona recortada y agrandada.
    // Cada imagen se lee además con dos modos de segmentación: el automático
    // (agrupa el texto como si fuera un documento normal) y "texto disperso"
    // (no intenta ordenar por columnas/párrafos) — una cédula tiene columnas
    // de datos separadas (foto+etiquetas a un lado, campos al otro) que el
    // modo automático a veces mezcla en una sola línea sin sentido.
    const imagenes = [canvas, prepararParaOCR(canvas)];
    const recorte = detectarRecorteTarjeta(canvas);
    if (recorte) imagenes.push(prepararParaOCR(recorte));

    const PSM_AUTO = '3';
    const PSM_TEXTO_DISPERSO = '11';
    const tareas = [];
    imagenes.forEach(function (imagen) {
      tareas.push({ imagen: imagen, psm: PSM_TEXTO_DISPERSO });
      tareas.push({ imagen: imagen, psm: PSM_AUTO });
    });

    obtenerWorkerCedula().then(function (worker) {
      // Un mismo worker no puede leer dos imágenes a la vez: se hace en fila.
      let cadena = Promise.resolve();
      const resultados = [];
      tareas.forEach(function (t) {
        cadena = cadena.then(function () {
          return worker.setParameters({ tessedit_pageseg_mode: t.psm })
            .then(function () { return worker.recognize(t.imagen); })
            .then(function (r) { resultados.push({ texto: (r.data && r.data.text) || '', error: null }); })
            .catch(function (error) {
              console.error('[OCR cédula] error:', error);
              resultados.push({ texto: '', error: (error && (error.message || String(error))) || 'error desconocido' });
            });
        });
      });
      return cadena.then(function () { return resultados; });
    }).then(function (resultados) {
      let textoMasLargo = '';
      const datosPorIntento = resultados.map(function (r, i) {
        console.log('[OCR cédula] intento ' + (i + 1) + ' de ' + resultados.length + ':', r.texto || r.error);
        if (r.texto.length > textoMasLargo.length) textoMasLargo = r.texto;
        return parsearCedulaEcuador(r.texto);
      });
      const mejor = elegirPorConsenso(datosPorIntento);
      aplicarDatosDetectados(mejor, resultados, textoMasLargo);
    });
  }

  function aplicarDatosDetectados(datos, resultados, textoMasLargo) {
    const form = input.closest('form');
    let mapa = {};
    try { mapa = JSON.parse(input.dataset.ocrCedula); } catch (e) { mapa = {}; }
    let algunDato = false;
    Object.keys(mapa).forEach(function (campo) {
      const valor = datos[campo];
      if (!valor || !form) return;
      const destino = form.querySelector('[name="' + mapa[campo] + '"]');
      if (!destino || destino.disabled) return;
      destino.value = valor;
      destino.style.background = '#fff8e1';
      setTimeout(function () { destino.style.background = ''; }, 2000);
      algunDato = true;
    });
    resultados = resultados || [];
    textoMasLargo = textoMasLargo || '';

    if (algunDato) {
      ocrStatus.textContent = '✅ Datos detectados de la cédula. Verifica que estén correctos antes de guardar.';
      ocrStatus.style.color = 'var(--verde-osc)';
    } else {
      // En vez de un mensaje generico, se explica la causa mas probable segun
      // lo que realmente paso (error tecnico vs. casi nada de texto legible
      // vs. texto que no calzo con el formato esperado de una cedula).
      const huboSoloErrores = resultados.length > 0 && resultados.every(function (r) { return r.error; });
      const totalCaracteres = textoMasLargo.replace(/\s/g, '').length;
      let motivo;
      if (huboSoloErrores) {
        motivo = 'hubo un error técnico leyendo la imagen (revisa el detalle técnico abajo)';
      } else if (totalCaracteres < 8) {
        motivo = 'la foto casi no dejó ver texto — probablemente salió borrosa, oscura o muy de lejos';
      } else {
        motivo = 'se leyó algo de texto pero no calzó con el formato de una cédula — revisa que sea el lado frontal, derecho y completo';
      }
      ocrStatus.textContent = '⚠️ No se pudo leer la cédula automáticamente: ' + motivo + '. Completa los datos a mano.';
      ocrStatus.style.color = '#a13a2f';
    }

    if (resultados.length) {
      const detalle = document.createElement('details');
      detalle.style.marginTop = '6px';
      detalle.style.fontSize = '0.72rem';
      detalle.style.color = '#888';
      const resumen = document.createElement('summary');
      resumen.textContent = 'Ver detalle técnico';
      resumen.style.cursor = 'pointer';
      detalle.appendChild(resumen);
      const pre = document.createElement('pre');
      pre.style.cssText = 'white-space:pre-wrap; word-break:break-word; background:#f4f6f5; ' +
        'border:1px solid var(--borde); border-radius:6px; padding:8px; margin-top:4px;';
      pre.textContent = resultados.map(function (r, i) {
        if (r.error) return 'Intento ' + (i + 1) + ': ERROR -> ' + r.error;
        const t = r.texto.trim();
        return 'Intento ' + (i + 1) + ' (' + r.texto.length + ' caracteres): ' + (t ? t.slice(0, 300) : '(vacío, no detectó texto)');
      }).join('\n\n');
      detalle.appendChild(pre);
      wrapper.appendChild(detalle);
    }
  }

  // Si el input lo pide (data-camara-guia) y el navegador soporta cámara,
  // agrega un botón para tomar la foto ahí mismo con una guía en pantalla:
  // así el delegado puede fotografiar la cédula del jugador en el momento,
  // ya bien encuadrada, sin depender de elegir un archivo de la galería.
  if (input.dataset.camaraGuia && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    const btnCamara = document.createElement('button');
    btnCamara.type = 'button';
    btnCamara.textContent = '📷 Tomar foto con guía';
    btnCamara.style.margin = '8px 0 0';
    btnCamara.style.fontSize = '0.85rem';
    input.insertAdjacentElement('afterend', btnCamara);

    btnCamara.addEventListener('click', function () {
      abrirCamaraConGuia(function (canvasCapturado) {
        input.dataset.nombreOriginal = 'cedula_' + Date.now();
        rotacion = 0;
        imgOriginal = canvasCapturado;
        render();
      });
    });
  }

  input.addEventListener('change', function () {
    rotacion = 0;
    const file = input.files && input.files[0];
    if (!file) { wrapper.innerHTML = ''; imgOriginal = null; return; }
    input.dataset.nombreOriginal = file.name.replace(/\.[^.]+$/, '');
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        imgOriginal = img;
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  const form = input.closest('form');
  if (form) {
    form.addEventListener('submit', function () {
      if (input._archivoRotado) {
        input.files = input._archivoRotado;
      }
    });
  }
});

// Un solo worker de Tesseract compartido por toda la página: crearlo tarda
// (descarga el motor y el idioma), así que se reutiliza entre intentos y
// entre los distintos campos de cédula en vez de crear uno nuevo cada vez.
let workerCedulaPromise = null;
function obtenerWorkerCedula() {
  if (!workerCedulaPromise) {
    workerCedulaPromise = Tesseract.createWorker('spa');
  }
  return workerCedulaPromise;
}

// Abre la cámara del celular con una guía en pantalla (marco proporción cédula)
// para que el delegado encaje la cédula del jugador ahí mismo. Al capturar,
// recorta exactamente lo que quedó dentro del marco y se lo entrega a quien
// llamó a esta función (que lo mete al mismo editor de rotación/OCR de siempre).
function abrirCamaraConGuia(onCapturar) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:#000; z-index:10000; ' +
    'display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px;';

  const contenedorVideo = document.createElement('div');
  contenedorVideo.style.cssText = 'position:relative; display:inline-block; max-width:100%; max-height:65vh;';

  const video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.muted = true;
  video.style.cssText = 'display:block; max-width:100%; max-height:65vh;';

  const guia = document.createElement('div');
  // Proporción real de una cédula (85.6 x 53.98 mm ≈ 1.586:1)
  guia.style.cssText = 'position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); ' +
    'width:82%; aspect-ratio:1.586; border:3px solid #4ade80; border-radius:12px; ' +
    'box-shadow:0 0 0 2000px rgba(0,0,0,0.5); pointer-events:none;';

  contenedorVideo.appendChild(video);
  contenedorVideo.appendChild(guia);

  const ayuda = document.createElement('p');
  ayuda.textContent = 'Encaja la cédula dentro del marco verde, bien iluminada';
  ayuda.style.cssText = 'color:#fff; font-size:0.9rem; margin:12px 0; text-align:center;';

  const botones = document.createElement('div');
  botones.style.cssText = 'display:flex; gap:10px;';

  const btnCapturar = document.createElement('button');
  btnCapturar.type = 'button';
  btnCapturar.textContent = '📸 Capturar';
  btnCapturar.disabled = true;

  const btnCancelar = document.createElement('button');
  btnCancelar.type = 'button';
  btnCancelar.textContent = 'Cancelar';
  btnCancelar.style.background = '#555';

  botones.appendChild(btnCapturar);
  botones.appendChild(btnCancelar);
  overlay.appendChild(contenedorVideo);
  overlay.appendChild(ayuda);
  overlay.appendChild(botones);
  document.body.appendChild(overlay);

  let stream = null;

  function cerrar() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    overlay.remove();
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false,
  }).then(function (s) {
    stream = s;
    video.srcObject = s;
    video.play();
    btnCapturar.disabled = false;
  }).catch(function () {
    ayuda.textContent = 'No se pudo abrir la cámara. Cierra esta ventana y usa "Seleccionar archivo".';
  });

  btnCancelar.addEventListener('click', cerrar);

  btnCapturar.addEventListener('click', function () {
    if (!video.videoWidth) return;
    const anchoGuiaRatio = 0.82;
    const relCedula = 1.586;
    const vw = video.videoWidth, vh = video.videoHeight;
    const cw = vw * anchoGuiaRatio;
    const ch = cw / relCedula;
    const cx = (vw - cw) / 2;
    const cy = (vh - ch) / 2;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(cw);
    canvas.height = Math.round(ch);
    canvas.getContext('2d').drawImage(video, cx, cy, cw, ch, 0, 0, canvas.width, canvas.height);

    cerrar();
    onCapturar(canvas);
  });
}

// Intenta ubicar dónde está la cédula dentro de una foto completa (por ejemplo
// una foto de WhatsApp donde la cédula sale chica sobre una mesa) buscando la
// zona con más detalle/contraste, y devuelve esa zona recortada y agrandada.
// Si no encuentra una zona confiable, devuelve null (no se fuerza un recorte
// que podría cortar datos en vez de ayudar).
function detectarRecorteTarjeta(canvasOriginal) {
  const w = canvasOriginal.width, h = canvasOriginal.height;
  if (w < 60 || h < 60) return null;

  const escala = Math.min(1, 400 / Math.max(w, h));
  const sw = Math.max(1, Math.round(w * escala));
  const sh = Math.max(1, Math.round(h * escala));
  const chico = document.createElement('canvas');
  chico.width = sw;
  chico.height = sh;
  const cctx = chico.getContext('2d');
  cctx.drawImage(canvasOriginal, 0, 0, sw, sh);
  const datos = cctx.getImageData(0, 0, sw, sh).data;

  const gris = new Float32Array(sw * sh);
  for (let i = 0, p = 0; i < datos.length; i += 4, p++) {
    gris[p] = 0.299 * datos[i] + 0.587 * datos[i + 1] + 0.114 * datos[i + 2];
  }

  const energiaFila = new Float64Array(sh);
  const energiaCol = new Float64Array(sw);
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const idx = y * sw + x;
      const dx = x + 1 < sw ? Math.abs(gris[idx] - gris[idx + 1]) : 0;
      const dy = y + 1 < sh ? Math.abs(gris[idx] - gris[idx + sw]) : 0;
      const e = dx + dy;
      energiaFila[y] += e;
      energiaCol[x] += e;
    }
  }

  function rangoConDatos(energia) {
    const n = energia.length;
    const suave = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, c = 0;
      for (let k = -2; k <= 2; k++) {
        const j = i + k;
        if (j >= 0 && j < n) { s += energia[j]; c++; }
      }
      suave[i] = s / c;
    }
    let maxVal = 0;
    for (let i = 0; i < n; i++) if (suave[i] > maxVal) maxVal = suave[i];
    if (maxVal <= 0) return null;
    const umbral = maxVal * 0.18;
    let ini = -1, fin = -1;
    for (let i = 0; i < n; i++) {
      if (suave[i] >= umbral) { if (ini === -1) ini = i; fin = i; }
    }
    if (ini === -1) return null;
    if (fin - ini < n * 0.12) return null;
    return [ini, fin];
  }

  const rangoY = rangoConDatos(energiaFila);
  const rangoX = rangoConDatos(energiaCol);
  if (!rangoY || !rangoX) return null;

  const areaDetectada = (rangoX[1] - rangoX[0]) * (rangoY[1] - rangoY[0]);
  if (areaDetectada > sw * sh * 0.92) return null; // ya ocupa casi toda la foto, no vale recortar

  const fx = w / sw, fy = h / sh;
  const margenX = (rangoX[1] - rangoX[0]) * 0.06;
  const margenY = (rangoY[1] - rangoY[0]) * 0.06;
  const x0 = Math.max(0, Math.round((rangoX[0] - margenX) * fx));
  const x1 = Math.min(w, Math.round((rangoX[1] + margenX) * fx));
  const y0 = Math.max(0, Math.round((rangoY[0] - margenY) * fy));
  const y1 = Math.min(h, Math.round((rangoY[1] + margenY) * fy));
  const cw = x1 - x0, ch = y1 - y0;
  if (cw < 30 || ch < 30) return null;

  const anchoObjetivo = 1100;
  const escalaFinal = Math.max(1, anchoObjetivo / cw);
  const salida = document.createElement('canvas');
  salida.width = Math.round(cw * escalaFinal);
  salida.height = Math.round(ch * escalaFinal);
  const sctx = salida.getContext('2d');
  sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(canvasOriginal, x0, y0, cw, ch, 0, 0, salida.width, salida.height);
  return salida;
}

// Interpreta el texto crudo que devuelve el OCR sobre una cédula ecuatoriana
// y trata de rescatar cédula, apellidos, nombres y fecha de nacimiento.
// Es heurístico (la calidad de la foto varía mucho), por eso el delegado
// siempre revisa/corrige los campos antes de guardar.
function parsearCedulaEcuador(texto) {
  const rawLines = texto.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
  const quitarAcentos = function (s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };
  const lines = rawLines.map(function (l) { return quitarAcentos(l).toUpperCase(); });
  const resultado = {};

  // Cédula: normalmente 10 dígitos seguidos, pero algunas cédulas nuevas la
  // muestran como "172605076-6" (9 dígitos + guion + dígito verificador).
  const textoJunto = lines.join(' ');
  let mCedula = textoJunto.match(/\b(\d{10})\b/);
  if (!mCedula) {
    const mConGuion = textoJunto.match(/\b(\d{9})\s*-\s*(\d)\b/);
    if (mConGuion) mCedula = [null, mConGuion[1] + mConGuion[2]];
  }
  if (mCedula) resultado.cedula = mCedula[1];

  const meses = { ENE: 1, FEB: 2, MAR: 3, ABR: 4, MAY: 5, JUN: 6, JUL: 7, AGO: 8, SEP: 9, SET: 9, OCT: 10, NOV: 11, DIC: 12 };
  function buscarFechaEn(candidatas) {
    for (let i = 0; i < candidatas.length; i++) {
      const l = candidatas[i];
      // Formato AAAA-MM-DD (algunas cédulas lo traen así, ya listo para el input date)
      let m = l.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
      if (m) return m[1] + '-' + m[2] + '-' + m[3];
      m = l.match(/(\d{1,2})[\/\-\s]+([A-Z]{3,4})[\/\-.\s]+(\d{4})/);
      if (m && meses[m[2].slice(0, 3)]) {
        return m[3] + '-' + String(meses[m[2].slice(0, 3)]).padStart(2, '0') + '-' + m[1].padStart(2, '0');
      }
      m = l.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    }
    return null;
  }
  // Ojo: "LUGAR DE NACIMIENTO" también contiene "NACIMIENTO" y en algunas
  // cédulas aparece ANTES que "FECHA DE NACIMIENTO" — hay que anclar a esta
  // etiqueta exacta para no quedarse mirando el lugar en vez de la fecha.
  const idxNac = lines.findIndex(function (l) { return l.indexOf('FECHA') !== -1 && l.indexOf('NACIMIENTO') !== -1; });
  const fecha = (idxNac !== -1 && buscarFechaEn(lines.slice(idxNac, idxNac + 3))) || buscarFechaEn(lines);
  if (fecha) resultado.fecha_nacimiento = fecha;

  // Etiquetas conocidas de la cédula ecuatoriana (en cualquiera de sus formatos):
  // marcan dónde termina un dato y empieza el siguiente.
  const ETIQUETAS = /REPUBLICA|ECUADOR|CEDULA|IDENTIDAD|NACIONALIDAD|LUGAR|FECHA|SEXO|EMISION|VENCIMIENTO|NUMERO|NUMBER|NUI\b|DOCUMENTO|SURNAME|VALIDEZ|FIRMA|CONDICION|CIUDADAN|REGISTRO|CIVIL|APELLID|NOMBRE/;
  function esRuido(l) {
    return !l || /^[\d\W]+$/.test(l) || ETIQUETAS.test(l);
  }
  function aTitleCase(s) {
    return s.toLowerCase().replace(/(^|\s)([a-zñáéíóúü])/g, function (m, p1, p2) { return p1 + p2.toUpperCase(); });
  }

  // Junta las líneas de datos que siguen a una etiqueta (ej. "APELLIDOS") hasta
  // toparse con la siguiente etiqueta conocida. Cubre tanto el caso de un solo
  // apellido/nombre en una línea como el de cada palabra en su propia línea
  // (formato usado en las cédulas nuevas).
  function recolectarValor(idxEtiqueta, maxLineas) {
    const partes = [];
    let ultimaLinea = idxEtiqueta;
    for (let i = idxEtiqueta + 1; i <= idxEtiqueta + maxLineas && i < lines.length; i++) {
      if (esRuido(lines[i]) || !/^[A-Z\s]+$/.test(lines[i])) break;
      partes.push(rawLines[i]);
      ultimaLinea = i;
    }
    return { valor: partes.length ? aTitleCase(partes.join(' ')) : null, ultimaLinea: ultimaLinea };
  }

  // Algunas cédulas traen etiquetas separadas ("APELLIDOS" ... "NOMBRES" ...) y otras
  // una sola etiqueta combinada ("APELLIDOS Y NOMBRES") seguida de las líneas de datos
  // (primero el/los apellido(s), luego el/los nombre(s)). Cubrimos ambos casos.
  let idxLineaApellidos = -1;
  const idxApellidos = lines.findIndex(function (l) { return l.indexOf('APELLID') !== -1; });
  const idxNombres = lines.findIndex(function (l, i) {
    return l.indexOf('NOMBRE') !== -1 && l.indexOf('APELLID') === -1 && (idxApellidos === -1 || i > idxApellidos);
  });
  if (idxApellidos !== -1) {
    // Con etiqueta NOMBRES separada, el límite de dónde termina el apellido es esa
    // etiqueta, así que es seguro juntar varias líneas (cada apellido en su línea).
    // Con etiqueta combinada "APELLIDOS Y NOMBRES" no hay forma de saber cuántas
    // líneas son apellido vs nombre, así que tomamos solo 1 línea para cada uno.
    const r = recolectarValor(idxApellidos, idxNombres !== -1 ? 3 : 1);
    if (r.valor) { resultado.apellidos = r.valor; idxLineaApellidos = r.ultimaLinea; }
  }
  if (idxNombres !== -1) {
    const r = recolectarValor(idxNombres, 3);
    if (r.valor) resultado.nombres = r.valor;
  } else if (idxLineaApellidos !== -1) {
    const r = recolectarValor(idxLineaApellidos, 1);
    if (r.valor) resultado.nombres = r.valor;
  }

  return resultado;
}
</script>
