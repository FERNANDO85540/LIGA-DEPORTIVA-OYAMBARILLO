<div class="card">
  <h2 style="text-align:center; margin-bottom:2px;">Campeonatos</h2>
  <p style="text-align:center; color:#888; font-size:0.85rem; margin:0 0 16px;">Elige un campeonato para ver su información.</p>
  <div class="cupos-grid" style="grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));">
    {% for c in categorias_liga %}
    <a href="{{ url_for(categoria_endpoint, categoria=c) }}" style="text-decoration:none; color:inherit;">
      <div class="cupo-item" style="text-align:center; padding:24px 14px; transition:box-shadow .15s ease; {% if c == categoria %}border-color:var(--verde); box-shadow:inset 0 0 0 1.5px var(--verde);{% endif %}">
        <div style="font-size:1.9rem; margin-bottom:8px;">{{ '🏆' if c == 'Senior' else '⚽' }}</div>
        <strong style="display:block; font-size:1.05rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--verde-osc);">{{ c }}</strong>
        <span style="display:block; margin-top:4px; font-size:0.8rem; color:#888;">{{ 'Campeonato activo' if c == categoria else 'Ver ' + c }}</span>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
